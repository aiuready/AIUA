# Local dev only. Production is Render's free managed Postgres (temporary,
# 2026-08-26 user decision, pending the company's own DigitalOcean/MySQL
# infra per the original TRD) - this mirrors the same Postgres engine
# locally so dev/prod stay in parity.
services:
  postgres:
    image: postgres:16
    container_name: aiua_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiua
      POSTGRES_USER: aiua
      POSTGRES_PASSWORD: aiua_dev
      # md5, not the postgres:16 image's scram-sha-256 default - worked
      # around a P1000 auth failure from Prisma's Windows engine that
      # produced no server-side log entry at all (never got that far).
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      # Not 5432: a native Windows postgres.exe service is also bound to
      # that port on this machine, and connections intermittently landed
      # on it instead of this container - the real cause of the "no
      # server-side log entry at all" mystery above (confirmed via
      # `tasklist` against the PID holding port 5432, 2026-08-28). 5436
      # avoids it, and avoids the other local projects' ports (Vendoor
      # Africa 5433, CashOS 5434).
      - "5436:5432"
    volumes:
      - aiua_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiua -d aiua"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aiua_postgres_data:
