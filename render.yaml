# Render Blueprint - provisions the web service + Postgres together.
# Deploy via Render dashboard: New > Blueprint > point at this repo.
#
# Temporary hosting (2026-08-26 user decision): free tier, pending the
# company's own DigitalOcean/MySQL infra per the original TRD. Free-tier
# caveats worth knowing: the web service spins down after ~15 min of
# inactivity (first request after that is slow - a "cold start"), and
# Render's free Postgres is deleted after 30 days unless upgraded.
services:
  - type: web
    name: aiua
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aiua-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Set manually once Render assigns the service URL (Dashboard >
      # aiua > Environment) - e.g. https://aiua.onrender.com. Used for
      # constructing email links (verification, password reset,
      # instructor setup) and payment gateway callback URLs.
      - key: NEXTAUTH_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      # Left unset = lib/storage.ts falls back to local disk (/tmp on a
      # container that recycles - unreliable, see lib/storage.ts). Set
      # these once real S3-compatible storage exists.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_KEY
        sync: false
      - key: STORAGE_SECRET
        sync: false

databases:
  - name: aiua-db
    plan: free
